<section class="panel">
  <p class="hint">Pick a direction, paste the input on the left and the result appears on the right as you type.</p>
  <div class="toolbar">
    <fieldset class="seg">
      <legend class="sr-only">Direction</legend>
      <label><input type="radio" name="mode" value="json2go" checked><span>JSON → Go</span></label>
      <label><input type="radio" name="mode" value="go2json"><span>Go → JSON</span></label>
    </fieldset>
    <label class="inline-field" id="root-wrap">Root type name <input type="text" id="root-name" value="Root" spellcheck="false"></label>
    <button class="btn btn--sm" type="button" id="swap">Swap</button>
    <button class="btn btn--sm" type="button" id="example">Load example</button>
  </div>
  <div class="row2">
    <label class="field"><span id="in-label">Input: JSON</span>
      <textarea class="code" id="in" spellcheck="false" rows="16"></textarea>
    </label>
    <label class="field"><span id="out-label">Output: Go</span>
      <textarea class="code" id="out" spellcheck="false" rows="16" readonly></textarea>
    </label>
  </div>
  <p class="err" role="alert" id="err" hidden></p>
  <div class="btn-row"><button class="btn btn--sm btn--primary" type="button" id="copy">Copy output</button></div>
  <p class="muted" id="note"></p>
</section>
